name: Markdown only

# Run for every branch:
# - pushes to any branch
# - pull requests targeting any branch
# - manual runs (Run workflow button)
on:
  push:
  pull_request:
  workflow_dispatch:

# The job only needs to read the code.
permissions:
  contents: read

jobs:
  check-file-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Fail if any file is not Markdown or text
        run: |
          # Files allowed even though they aren't Markdown or text.
          allowed='^(\.gitignore|\.gitattributes|\.claude/settings\.json|\.github/workflows/[^/]+\.ya?ml)$'

          # List every tracked file, drop .md and .txt files, drop the allowed exceptions.
          bad=$(git ls-files | grep -viE '\.(md|txt)$' | grep -vE "$allowed" || true)

          if [ -n "$bad" ]; then
            echo "Only Markdown (.md) and text (.txt) files are allowed in this repo."
            echo "$bad" | while read -r f; do
              echo "::error file=$f::Not a Markdown or text file: $f"
            done
            exit 1
          fi

          echo "All files are Markdown, text, or allowed exceptions."
